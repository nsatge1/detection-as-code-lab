title: Linux Reverse Shell Using /dev/tcp
id: d055e43a-89bf-4c03-9c3b-01faf0377a2e
status: experimental
description: |
  Detects a shell command that uses the special /dev/tcp or /dev/udp paths of Bash.
  This is the most common way to open a reverse shell after exploiting a web server.
references:
  - https://attack.mitre.org/techniques/T1059/004/
author: Nathan Satge
date: 2026-10-18
tags:
  - attack.execution
  - attack.t1059.004
logsource:
  product: linux
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - '/dev/tcp/'
      - '/dev/udp/'
  condition: selection
falsepositives:
  - Health-check scripts that test a port with /dev/tcp (should be on a known list)
level: high
