title: SAM, SYSTEM or SECURITY Hive Saved With Reg.exe
id: afbf0826-260e-4f77-8d85-3ddc127a9bc1
status: experimental
description: |
  Detects reg.exe saving or exporting the SAM, SYSTEM or SECURITY registry hives.
  With these files an attacker can extract local password hashes offline.
references:
  - https://attack.mitre.org/techniques/T1003/002/
author: Nathan Satge
date: 2026-10-18
tags:
  - attack.credential-access
  - attack.t1003.002
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    - Image|endswith: '\reg.exe'
    - OriginalFileName: 'reg.exe'
  selection_action:
    CommandLine|contains:
      - ' save '
      - ' export '
  selection_hive:
    CommandLine|contains:
      - 'hklm\sam'
      - 'hklm\system'
      - 'hklm\security'
      - 'hkey_local_machine\sam'
      - 'hkey_local_machine\system'
      - 'hkey_local_machine\security'
  condition: all of selection_*
falsepositives:
  - Backup software that exports registry hives
level: high
