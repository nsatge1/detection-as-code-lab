title: Scheduled Task Created to Run From a User-Writable Folder
id: d12394ff-5c60-4105-9d06-3cb90c0754f9
status: experimental
description: |
  Detects schtasks.exe creating a task that runs a program from Temp, AppData or
  C:\Users\Public. Malware often uses this for persistence.
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: Nathan Satge
date: 2026-10-18
tags:
  - attack.persistence
  - attack.execution
  - attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    Image|endswith: '\schtasks.exe'
  selection_create:
    CommandLine|contains|windash: ' -create '
  selection_path:
    CommandLine|contains:
      - '\AppData\Local\Temp\'
      - '\AppData\Roaming\'
      - '\Users\Public\'
      - '\Windows\Temp\'
      - '%TEMP%'
      - '%APPDATA%'
  condition: all of selection_*
falsepositives:
  - Some software updaters install tasks from AppData (Teams, Zoom). Add filters for them
level: medium
