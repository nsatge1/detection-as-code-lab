title: User Added to the Local Administrators Group With Net.exe
id: 9b656be8-d303-4a81-a02b-58da8d5a73f7
status: experimental
description: |
  Detects "net localgroup administrators <user> /add". Attackers add an account
  to the local admins group to keep privileged access. The French group name
  "Administrateurs" is also covered.
references:
  - https://attack.mitre.org/techniques/T1098/
author: Nathan Satge
date: 2026-10-18
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1098
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    Image|endswith:
      - '\net.exe'
      - '\net1.exe'
  selection_cmd:
    CommandLine|contains|all:
      - 'localgroup'
      - '/add'
  selection_group:
    CommandLine|contains:
      - 'administrators'
      - 'administrateurs'
  condition: all of selection_*
falsepositives:
  - IT onboarding scripts. Check who ran the command and when
level: medium
