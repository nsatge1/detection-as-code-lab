title: Shadow Copies or Backup Catalog Deleted
id: 6fb8c7b8-5b27-4c6e-8a47-dd0c5af0e22d
status: experimental
description: |
  Detects vssadmin, wmic or wbadmin deleting shadow copies or the backup catalog.
  Ransomware does this before encryption so the victim cannot restore files.
references:
  - https://attack.mitre.org/techniques/T1490/
author: Nathan Satge
date: 2026-10-18
tags:
  - attack.impact
  - attack.t1490
logsource:
  product: windows
  category: process_creation
detection:
  selection_vssadmin:
    Image|endswith: '\vssadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'shadows'
  selection_wmic:
    Image|endswith: '\wmic.exe'
    CommandLine|contains|all:
      - 'shadowcopy'
      - 'delete'
  selection_wbadmin:
    Image|endswith: '\wbadmin.exe'
    CommandLine|contains|all:
      - 'delete'
      - 'catalog'
  condition: 1 of selection_*
falsepositives:
  - Backup administrators cleaning old snapshots (should be rare and planned)
level: high
