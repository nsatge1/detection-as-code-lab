title: Office Application Spawns a Shell or Script Interpreter
id: da7131a0-d585-4535-9a9b-ce0a84154ff7
status: experimental
description: |
  Detects Word, Excel, PowerPoint, Outlook or OneNote starting a shell, a script
  host or a common LOLBin. This is a classic sign of a malicious macro or
  phishing attachment.
references:
  - https://attack.mitre.org/techniques/T1566/001/
  - https://attack.mitre.org/techniques/T1204/002/
author: Nathan Satge
date: 2026-10-18
tags:
  - attack.initial-access
  - attack.t1566.001
  - attack.execution
  - attack.t1204.002
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith:
      - '\WINWORD.EXE'
      - '\EXCEL.EXE'
      - '\POWERPNT.EXE'
      - '\OUTLOOK.EXE'
      - '\ONENOTE.EXE'
      - '\MSACCESS.EXE'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
      - '\rundll32.exe'
      - '\regsvr32.exe'
      - '\certutil.exe'
      - '\bitsadmin.exe'
  condition: selection_parent and selection_child
falsepositives:
  - Rare legitimate macros used by finance teams (check the full command line)
level: high
